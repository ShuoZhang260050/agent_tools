<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e5e5e7;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #10a37f;
    --accent-hover: #0e8a6c;
    --user-bg: #10a37f;
    --user-fg: #ffffff;
    --assistant-bg: #ffffff;
    --tool-bg: #f0f4ff;
    --tool-border: #c7d7fe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  /* 侧边栏 */
  #sidebar {
    width: 260px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  #sidebar header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px; }
  #new-btn {
    margin: 12px 16px; padding: 10px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  #new-btn:hover { background: var(--accent-hover); }
  #session-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .session-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-item:hover { background: #f0f0f2; }
  .session-item.active { background: #e7f6f0; color: var(--accent); font-weight: 500; }
  .session-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  /* 主区域 */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); font-weight: 600; font-size: 14px; }
  #model-picker { position: relative; flex-shrink: 0; }
  #model-button {
    width: 118px; height: 44px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); color: var(--text); padding: 0 10px; font: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  #model-button:hover, #model-button:focus { border-color: var(--accent); outline: none; }
  #model-short { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
  #model-caret { color: var(--muted); font-size: 11px; }
  #model-menu {
    display: none; position: absolute; right: 0; bottom: 52px; width: 300px; max-height: 260px;
    overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.14); padding: 6px; z-index: 10;
  }
  #model-picker.open #model-menu { display: block; }
  .model-option {
    width: 100%; border: none; background: transparent; color: var(--text); border-radius: 8px;
    padding: 8px 10px; cursor: pointer; text-align: left; font: inherit;
  }
  .model-option:hover { background: #f0f0f2; }
  .model-option.active { background: #e7f6f0; color: var(--accent); }
  .model-option .model-name { font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
  .model-option .model-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .msg { max-width: 760px; margin: 0 auto 20px; display: flex; flex-direction: column; }
  .msg.user .bubble { background: var(--user-bg); color: var(--user-fg); align-self: flex-end; }
  .msg.assistant .bubble { background: var(--assistant-bg); border: 1px solid var(--border); }
  .bubble { padding: 12px 16px; border-radius: 14px; max-width: 80%; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .msg.user .bubble { border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { border-bottom-left-radius: 4px; }
  .role-label { font-size: 11px; color: var(--muted); margin-bottom 4px; padding: 0 4px; }
   .msg.user .role-label { align-self: flex-end; }
   /* markdown 内容溢出保护 */
   .bubble.markdown { white-space: normal; }
   .bubble.markdown p { margin: 0 0 8px; }
   .bubble.markdown p:last-child { margin-bottom: 0; }
   .bubble pre { background: #f6f8fa; padding: 8px 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; max-width: 100%; }
   .bubble code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
   .bubble pre code { background: none; padding: 0; }
   .bubble :not(pre) > code { background: rgba(175,184,193,0.2); padding: 1px 5px; border-radius: 4px; }
   .bubble img { max-width: 100%; height: auto; }
   .bubble table { display: block; overflow-x: auto; max-width: 100%; border-collapse: collapse; margin: 8px 0; }
   .bubble a { word-break: break-all; }
   .bubble ul, .bubble ol { padding-left: 22px; margin: 8px 0; }
   .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 12px 0 6px; line-height: 1.3; }
   /* 工具卡片 */
  .tool-card {
    max-width: 760px; margin: 6px auto 6px auto; background: var(--tool-bg); border: 1px solid var(--tool-border);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.5;
  }
  .tool-card .tc-head { font-weight: 600; color: #4338ca; display: flex; align-items: center; gap: 6px; }
  .tool-card .tc-status { font-size: 11px; color: var(--muted); font-weight: 400; }
  .tool-card .tc-status.running { color: #d97706; }
  .tool-card .tc-status.done { color: var(--accent); }
  .tool-card .tc-args { margin-top: 6px; color: #4b5563; }
  .tool-card .tc-args code { background: #e0e7ff; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .tool-card .tc-result { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #c7d7fe; color: #374151; white-space: pre-wrap; word-break: break-word; }
  .tool-card .tc-head { cursor: pointer; user-select: none; }
  .tool-card .tc-toggle { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; }
  .tool-card.collapsed .tc-args,
  .tool-card.collapsed .tc-result { display: none; }
  /* 输入区 */
  #input-bar { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--panel); }
  #input-wrap { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #msg-input {
    flex: 1; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    font-size: 14px; resize: none; min-height: 44px; max-height: 160px; font-family: inherit; outline: none;
  }
  #msg-input:focus { border-color: var(--accent); }
  #send-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    width: 44px; height: 44px; cursor: pointer; font-size: 18px; flex-shrink: 0;
  }
  #send-btn:hover { background: var(--accent-hover); }
  #send-btn:disabled { background: #ccc; cursor: not-allowed; }
  .typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin: 0 2px; animation: blink 1.4s infinite both; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
  /* 会话项 */
  .session-item { display: flex; align-items: center; justify-content: space-between; }
  .session-item .sid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .session-item .del-btn { opacity: 0; background: none; border: none; color: #e53e3e; cursor: pointer; font-size: 14px; padding: 0 4px; flex-shrink: 0; }
  .session-item:hover .del-btn { opacity: 0.7; }
  .session-item .del-btn:hover { opacity: 1; }
  .session-item .rename-input { width: 100%; border: 1px solid var(--accent); border-radius: 4px; padding: 2px 6px; font-size: 13px; font-family: inherit; outline: none; }
  /* 文档区 */
  #doc-section { border-top: 1px solid var(--border); padding: 0 16px 8px; max-height: 200px; overflow-y: auto; }
  #doc-section h3 { font-size: 12px; color: var(--muted); margin: 10px 0 6px; font-weight: 600; }
  .doc-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; font-size: 12px; margin-bottom: 2px; }
  .doc-item:hover { background: #f0f0f2; }
  .doc-item .doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .doc-item .doc-del { opacity: 0; background: none; border: none; color: #e53e3e; cursor: pointer; font-size: 12px; padding: 0 2px; flex-shrink: 0; }
  .doc-item:hover .doc-del { opacity: 0.7; }
  /* 附件按钮 */
  #attachment-picker { position: relative; flex-shrink: 0; }
  #attachment-btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; width: 44px; height: 44px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  #attachment-btn:hover, #attachment-btn:focus { border-color: var(--accent); outline: none; }
  #attachment-menu {
    display: none; position: absolute; left: 0; bottom: 52px; width: 170px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.14);
    padding: 6px; z-index: 10;
  }
  #attachment-picker.open #attachment-menu { display: block; }
  .attachment-option {
    width: 100%; border: none; background: transparent; color: var(--text); border-radius: 8px;
    padding: 9px 10px; cursor: pointer; text-align: left; font: inherit; font-size: 13px;
  }
  .attachment-option:hover { background: #f0f0f2; }
  #image-preview { max-width: 760px; margin: 0 auto 8px; display: none; position: relative; }
  #image-preview img { max-width: 200px; max-height: 200px; border-radius: 8px; border: 1px solid var(--border); }
  #image-preview .remove-img { position: absolute; top: -6px; left: 194px; background: #e53e3e; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 14px; line-height: 1; }
  /* 追踪面板 */
  #trace-panel { max-height: 300px; overflow-y: auto; background: var(--panel); border-bottom: 1px solid var(--border); display: none; }
  #trace-panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #trace-panel th { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  #trace-panel td { padding: 4px 12px; border-bottom: 1px solid #f0f0f2; }
  #trace-panel tr.llm td { background: #f0fdf4; }
  #trace-panel tr.tool td { background: #eff6ff; }
  .trace-btn { font-size: 12px; color: var(--accent); cursor: pointer; margin-left: 12px; font-weight: 400; }
</style>
</head>
<body>
  <div id="auth-view" style="display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;">
    <div style="width:340px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;">
      <h2 style="margin-bottom:20px;font-size:20px;">Agent Chat</h2>
      <div id="auth-tabs" style="display:flex;gap:8px;margin-bottom:16px;">
        <button id="tab-login" onclick="switchTab('login')" style="flex:1;padding:8px;border:1px solid var(--border);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-size:14px;">登录</button>
        <button id="tab-register" onclick="switchTab('register')" style="flex:1;padding:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;cursor:pointer;font-size:14px;">注册</button>
      </div>
      <input id="auth-username" placeholder="用户名" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:8px;box-sizing:border-box;"><br>
      <input id="auth-password" type="password" placeholder="密码" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:16px;box-sizing:border-box;">
      <button id="auth-submit" onclick="doAuth()" style="width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;">登录</button>
      <div id="auth-error" style="color:#e53e3e;font-size:13px;margin-top:8px;display:none;"></div>
    </div>
  </div>
  <div id="app" style="display:none;flex:1;">
  <div id="sidebar">
    <header>会话 <span id="cur-user" style="font-weight:400;color:var(--muted);font-size:12px;"></span> <a href="#" onclick="logout();return false;" style="font-size:12px;color:var(--accent);margin-left:8px;">退出</a></header>
    <button id="new-btn">+ 新建会话</button>
    <div id="session-list"></div>
    <div id="doc-section">
      <h3>文档知识库 <span style="font-weight:400;color:var(--muted);">（可问 Agent 检索）</span></h3>
      <div id="doc-list"></div>
    </div>
  </div>
  <div id="main">
    <div id="header">Agent Chat <span id="cur-tid" style="font-weight:400;color:var(--muted);font-size:12px;"></span><span class="trace-btn" id="trace-toggle" onclick="toggleTrace()">调试</span></div>
    <div id="trace-panel"><table><thead><tr><th>时间</th><th>类型</th><th>名称</th><th>耗时</th><th>Tokens</th></tr></thead><tbody id="trace-body"></tbody></table></div>
    <div id="messages"></div>
    <div id="input-bar">
      <div id="image-preview"><img id="preview-img" src=""><button class="remove-img" onclick="clearImage()">✕</button></div>
      <div id="input-wrap">
        <input type="file" id="file-input" style="display:none" accept=".txt,.md,.pdf">
        <input type="file" id="image-input" style="display:none" accept="image/*">
        <div id="attachment-picker">
          <button id="attachment-btn" type="button" title="上传附件">📎</button>
          <div id="attachment-menu">
            <button class="attachment-option" type="button" data-kind="image">🖼️ 上传图片</button>
            <button class="attachment-option" type="button" data-kind="file">📄 上传文件</button>
          </div>
        </div>
        <textarea id="msg-input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
        <div id="model-picker">
          <button id="model-button" type="button" title="选择模型"><span id="model-short">模型</span><span id="model-caret">▾</span></button>
          <div id="model-menu"></div>
        </div>
        <button id="send-btn">➤</button>
      </div>
    </div>
  </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const messagesEl = $("#messages");
const inputEl = $("#msg-input");
const sendBtn = $("#send-btn");
const sessionListEl = $("#session-list");
const curTidEl = $("#cur-tid");
const docListEl = $("#doc-list");
const tracePanelEl = $("#trace-panel");
const traceBodyEl = $("#trace-body");
const attachmentPickerEl = $("#attachment-picker");
const attachmentButtonEl = $("#attachment-btn");
const attachmentMenuEl = $("#attachment-menu");
const modelPickerEl = $("#model-picker");
const modelButtonEl = $("#model-button");
const modelShortEl = $("#model-short");
const modelMenuEl = $("#model-menu");

let currentTid = null;
let sending = false;
let authToken = localStorage.getItem("agent_token") || "";
let authMode = "login";
let traceVisible = false;
let currentImage = null;
let currentModel = localStorage.getItem("agent_model") || "";
let availableModels = [];

function getToken() { return localStorage.getItem("agent_token") || ""; }
function authHeaders() {
  const t = getToken();
  return t ? { "Content-Type": "application/json", "Authorization": "Bearer " + t } : { "Content-Type": "application/json" };
}

function checkAuth() {
  if (getToken()) {
    document.getElementById("auth-view").style.display = "none";
    document.getElementById("app").style.display = "flex";
    const u = localStorage.getItem("agent_user") || "";
    document.getElementById("cur-user").textContent = u ? "· " + u : "";
    newSession();
    loadSessions();
    loadDocuments();
    loadModels();
  } else {
    document.getElementById("auth-view").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
}

async function loadModels() {
  try {
    const resp = await fetch("/models", { headers: authHeaders() });
    const data = await resp.json();
    const models = data.models || [];
    availableModels = models;
    if (models.length) {
      const names = models.map((m) => m.name);
      if (!currentModel || !names.includes(currentModel)) currentModel = names[0];
      localStorage.setItem("agent_model", currentModel);
    }
    renderModelPicker();
  } catch (e) {
    console.error(e);
  }
}

function modelShortName(name) {
  const lower = (name || "").toLowerCase();
  if (lower.startsWith("glm-")) return "GLM " + name.slice(4);
  if (lower.includes("doubao-seed-2.0-code")) return "DB 2.0 Code";
  if (lower.includes("doubao-seed-2.0-pro")) return "DB 2.0 Pro";
  if (lower.includes("doubao-seed-code")) return "DB Code";
  if (lower.includes("deepseek")) return "DeepSeek";
  if (lower.includes("kimi")) return "Kimi";
  return name.length > 12 ? name.slice(0, 11) + "…" : name;
}

function renderModelPicker() {
  const current = availableModels.find((m) => m.name === currentModel);
  modelShortEl.textContent = current ? modelShortName(current.name) : "模型";
  modelButtonEl.title = current ? current.name : "选择模型";
  modelMenuEl.innerHTML = "";
  availableModels.forEach((m) => {
    const option = document.createElement("button");
    option.type = "button";
    option.className = "model-option" + (m.name === currentModel ? " active" : "");
    option.innerHTML =
      '<div class="model-name">' + escapeHtml(m.name) + '</div>' +
      '<div class="model-meta">' + escapeHtml(modelShortName(m.name)) + (m.vision ? " · 支持图片" : " · 仅文本") + '</div>';
    option.onclick = () => {
      currentModel = m.name;
      localStorage.setItem("agent_model", currentModel);
      modelPickerEl.classList.remove("open");
      renderModelPicker();
      inputEl.focus();
    };
    modelMenuEl.appendChild(option);
  });
}

function switchTab(mode) {
  authMode = mode;
  document.getElementById("tab-login").style.background = mode === "login" ? "var(--accent)" : "var(--bg)";
  document.getElementById("tab-login").style.color = mode === "login" ? "#fff" : "var(--text)";
  document.getElementById("tab-register").style.background = mode === "register" ? "var(--accent)" : "var(--bg)";
  document.getElementById("tab-register").style.color = mode === "register" ? "#fff" : "var(--text)";
  document.getElementById("auth-submit").textContent = mode === "login" ? "登录" : "注册";
  document.getElementById("auth-error").style.display = "none";
}

async function doAuth() {
  const username = document.getElementById("auth-username").value.trim();
  const password = document.getElementById("auth-password").value;
  if (!username || !password) {
    document.getElementById("auth-error").textContent = "请输入用户名和密码";
    document.getElementById("auth-error").style.display = "block";
    return;
  }
  const endpoint = authMode === "login" ? "/login" : "/register";
  try {
    const resp = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      document.getElementById("auth-error").textContent = data.detail || "操作失败";
      document.getElementById("auth-error").style.display = "block";
      return;
    }
    localStorage.setItem("agent_token", data.token);
    localStorage.setItem("agent_user", data.user.username);
    checkAuth();
  } catch (e) {
    document.getElementById("auth-error").textContent = "网络错误: " + e.message;
    document.getElementById("auth-error").style.display = "block";
  }
}

function logout() {
  localStorage.removeItem("agent_token");
  localStorage.removeItem("agent_user");
  currentTid = null;
  checkAuth();
}

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function addMsg(role, content, opts) {
  const markdown = !!(opts && opts.markdown);
  const image = opts && opts.image;
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const label = document.createElement("div");
  label.className = "role-label";
  label.textContent = role === "user" ? "你" : "Agent";
  const bubble = document.createElement("div");
  bubble.className = markdown ? "bubble markdown" : "bubble";
  if (markdown) bubble.innerHTML = renderMarkdown(content || "");
  else bubble.textContent = content || "";
  if (image) {
    const img = document.createElement("img");
    img.src = image;
    img.style.cssText = "max-width:100%;max-height:300px;border-radius:8px;margin-top:8px;";
    bubble.appendChild(img);
  }
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollBottom();
  return bubble;
}

function setCardCollapsed(card, collapsed) {
  card.classList.toggle("collapsed", collapsed);
  const toggle = card.querySelector(".tc-toggle");
  if (toggle) toggle.textContent = collapsed ? "▸ 详情" : "▾ 收起";
}

function attachCardToggle(card) {
  card.querySelector(".tc-head").addEventListener("click", () => {
    setCardCollapsed(card, !card.classList.contains("collapsed"));
  });
}

function addToolCard(toolCall) {
  const card = document.createElement("div");
  card.className = "tool-card";
  card.dataset.callId = toolCall.id || "";
  card.innerHTML =
    '<div class="tc-head">🔧 ' + escapeHtml(toolCall.name) +
    ' <span class="tc-status running">运行中…</span>' +
    '<span class="tc-toggle">▾ 收起</span></div>' +
    '<div class="tc-args">参数: <code>' + escapeHtml(JSON.stringify(toolCall.args)) + '</code></div>';
  attachCardToggle(card);
  messagesEl.appendChild(card);
  scrollBottom();
  return card;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// markdown -> HTML；marked 先转义 HTML，DOMPurify 再兜底防 XSS。
// 离线（CDN 未加载）或渲染异常时降级为纯文本转义 + 换行，保证不报错。
if (typeof marked !== "undefined" && marked.use) { marked.use({ breaks: true, gfm: true }); }
function renderMarkdown(text) {
  var fallback = escapeHtml(text || "").replace(/\n/g, "<br>");
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined") return fallback;
  try { return DOMPurify.sanitize(marked.parse(text || "")); }
  catch (e) { return fallback; }
}

function showTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.id = "typing-msg";
  wrap.innerHTML = '<div class="role-label">Agent</div><div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
  messagesEl.appendChild(wrap);
  scrollBottom();
}
function removeTyping() {
  const t = $("#typing-msg");
  if (t) t.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if ((!text && !currentImage) || sending) return;
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = "";
  inputEl.style.height = "auto";
  addMsg("user", text, { image: currentImage });
  const imageData = currentImage;
  currentImage = null;
  document.getElementById("image-preview").style.display = "none";
  showTyping();

  let assistantBubble = null;
  let assistantRaw = "";
  let currentToolCards = {};

  try {
    const body = { message: text || "请描述这张图片", thread_id: currentTid };
    if (currentModel) body.model = currentModel;
    if (imageData) body.image = imageData;
    const resp = await fetch("/chat", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify(body),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.split("\n").find((l) => l.startsWith("data: "));
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.type === "token") {
          removeTyping();
          if (!assistantBubble) {
            assistantBubble = addMsg("assistant", "", { markdown: true });
            assistantRaw = "";
          }
          assistantRaw += ev.content;
          assistantBubble.innerHTML = renderMarkdown(assistantRaw);
          scrollBottom();
        } else if (ev.type === "tool_call") {
          removeTyping();
          const card = addToolCard(ev);
          if (ev.id) currentToolCards[ev.id] = card;
        } else if (ev.type === "tool_result") {
          const card = ev.tool_call_id ? currentToolCards[ev.tool_call_id] : null;
          if (card) {
            const status = card.querySelector(".tc-status");
            status.textContent = "完成";
            status.className = "tc-status done";
            const resEl = document.createElement("div");
            resEl.className = "tc-result";
            resEl.textContent = "结果: " + ev.content;
            card.appendChild(resEl);
          }
          scrollBottom();
        } else if (ev.type === "error") {
          removeTyping();
          addMsg("assistant", "⚠️ " + (ev.message || "未知错误"));
        } else if (ev.type === "done") {
          currentTid = ev.thread_id;
          curTidEl.textContent = currentTid ? "· " + currentTid.slice(0, 8) : "";
          removeTyping();
          if (!assistantBubble) addMsg("assistant", "（无内容返回）");
          Object.values(currentToolCards).forEach((card) => { card.style.display = "none"; });
          loadSessions();
        }
      }
    }
  } catch (e) {
    removeTyping();
    addMsg("assistant", "⚠️ 请求失败: " + e.message);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function loadSessions() {
  try {
    const resp = await fetch("/sessions", { headers: authHeaders() });
    const data = await resp.json();
    sessionListEl.innerHTML = "";
    data.sessions.forEach((s) => {
      const item = document.createElement("div");
      item.className = "session-item" + (s.thread_id === currentTid ? " active" : "");
      const titleText = s.title || s.thread_id.slice(0, 18) + "…";
      item.innerHTML = '<div class="sid">' + escapeHtml(titleText) + '</div>' +
        '<button class="del-btn" title="删除">✕</button>';
      const sidEl = item.querySelector(".sid");
      sidEl.title = "双击重命名";
      sidEl.addEventListener("dblclick", () => startRename(item, s.thread_id, sidEl));
      item.querySelector(".del-btn").onclick = (e) => { e.stopPropagation(); deleteSession(s.thread_id); };
      item.onclick = () => selectSession(s.thread_id);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = s.message_count + " 条消息";
      sidEl.appendChild(meta);
      sessionListEl.appendChild(item);
    });
  } catch (e) { console.error(e); }
}

function startRename(item, tid, sidEl) {
  const old = sidEl.textContent.replace(/\n.*$/, "").trim();
  const input = document.createElement("input");
  input.className = "rename-input";
  input.value = old;
  sidEl.innerHTML = "";
  sidEl.appendChild(input);
  input.focus();
  input.select();
  const finish = async (save) => {
    if (save && input.value.trim()) {
      try {
        await fetch("/sessions/" + encodeURIComponent(tid), {
          method: "PATCH",
          headers: authHeaders(),
          body: JSON.stringify({ title: input.value.trim() }),
        });
      } catch (e) { console.error(e); }
    }
    loadSessions();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
  input.addEventListener("blur", () => finish(true));
}

async function deleteSession(tid) {
  if (!confirm("确定删除此会话？")) return;
  try {
    await fetch("/sessions/" + encodeURIComponent(tid), { method: "DELETE", headers: authHeaders() });
    if (currentTid === tid) { currentTid = null; newSession(); }
    loadSessions();
  } catch (e) { console.error(e); }
}

async function selectSession(tid) {
  if (sending) return;
  currentTid = tid;
  curTidEl.textContent = "· " + tid.slice(0, 8);
  messagesEl.innerHTML = "";
  try {
    const resp = await fetch("/sessions/" + encodeURIComponent(tid), { headers: authHeaders() });
    const data = await resp.json();
    (data.messages || []).forEach((m) => {
      if (m.role === "user") {
        addMsg("user", m.content, { image: m.image });
      } else if (m.role === "assistant") {
        if (m.tool_calls && m.tool_calls.length) return;
        if (m.content) addMsg("assistant", m.content, { markdown: true });
      }
    });
    scrollBottom();
    loadSessions();
  } catch (e) {
    addMsg("assistant", "⚠️ 加载历史失败: " + e.message);
  }
}

function newSession() {
  if (sending) return;
  currentTid = null;
  curTidEl.textContent = "";
  messagesEl.innerHTML = "";
  addMsg("assistant", "新会话已创建，输入消息开始对话。");
  inputEl.focus();
}

sendBtn.onclick = sendMessage;
$("#new-btn").onclick = newSession;
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});
inputEl.addEventListener("paste", function(e) {
  const items = (e.clipboardData || {}).items || [];
  for (const item of items) {
    if (item.type && item.type.startsWith("image/")) {
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        currentImage = ev.target.result;
        document.getElementById("preview-img").src = currentImage;
        document.getElementById("image-preview").style.display = "block";
      };
      reader.readAsDataURL(file);
      break;
    }
  }
});

document.getElementById("file-input").addEventListener("change", uploadFile);
attachmentButtonEl.addEventListener("click", (e) => {
  e.stopPropagation();
  modelPickerEl.classList.remove("open");
  attachmentPickerEl.classList.toggle("open");
});
attachmentMenuEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".attachment-option");
  if (!btn) return;
  attachmentPickerEl.classList.remove("open");
  const inputId = btn.dataset.kind === "image" ? "image-input" : "file-input";
  document.getElementById(inputId).click();
});
modelButtonEl.addEventListener("click", (e) => {
  e.stopPropagation();
  attachmentPickerEl.classList.remove("open");
  modelPickerEl.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!modelPickerEl.contains(e.target)) modelPickerEl.classList.remove("open");
  if (!attachmentPickerEl.contains(e.target)) attachmentPickerEl.classList.remove("open");
});

async function uploadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  addMsg("user", "📎 上传文档: " + file.name);
  showTyping();
  try {
    const resp = await fetch("/documents", {
      method: "POST",
      headers: { "Authorization": "Bearer " + getToken() },
      body: formData,
    });
    const data = await resp.json();
    removeTyping();
    if (!resp.ok) {
      addMsg("assistant", "⚠️ 上传失败: " + (data.detail || "未知错误"));
    } else {
      addMsg("assistant", "✅ 文档已入库: " + data.filename + "（" + data.chunks + " 个片段）。你可以让我检索文档内容。");
      loadDocuments();
    }
  } catch (err) {
    removeTyping();
    addMsg("assistant", "⚠️ 上传失败: " + err.message);
  }
  e.target.value = "";
}

document.getElementById("image-input").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    currentImage = ev.target.result;
    document.getElementById("preview-img").src = currentImage;
    document.getElementById("image-preview").style.display = "block";
    inputEl.focus();
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});

function clearImage() {
  currentImage = null;
  document.getElementById("image-preview").style.display = "none";
}

async function loadDocuments() {
  try {
    const resp = await fetch("/documents", { headers: authHeaders() });
    const data = await resp.json();
    docListEl.innerHTML = "";
    if (!data.documents || data.documents.length === 0) {
      docListEl.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:4px 8px;">暂无文档</div>';
      return;
    }
    data.documents.forEach((d) => {
      const item = document.createElement("div");
      item.className = "doc-item";
      item.innerHTML = '<span class="doc-name">📄 ' + escapeHtml(d.filename) + '</span>' +
        '<button class="doc-del" title="删除">✕</button>';
      item.querySelector(".doc-del").onclick = () => deleteDocument(d.id, d.filename);
      docListEl.appendChild(item);
    });
  } catch (e) { console.error(e); }
}

async function deleteDocument(docId, filename) {
  if (!confirm("确定删除文档 " + filename + " ？")) return;
  try {
    await fetch("/documents/" + docId, { method: "DELETE", headers: authHeaders() });
    loadDocuments();
  } catch (e) { console.error(e); }
}

function toggleTrace() {
  traceVisible = !traceVisible;
  tracePanelEl.style.display = traceVisible ? "block" : "none";
  if (traceVisible) loadTraces();
}

async function loadTraces() {
  try {
    const url = "/traces" + (currentTid ? "?thread_id=" + encodeURIComponent(currentTid) : "");
    const resp = await fetch(url, { headers: authHeaders() });
    const data = await resp.json();
    traceBodyEl.innerHTML = "";
    if (!data.traces || data.traces.length === 0) {
      traceBodyEl.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:12px;">暂无追踪记录</td></tr>';
      return;
    }
    data.traces.forEach((t) => {
      const tr = document.createElement("tr");
      tr.className = t.type;
      const ts = t.timestamp ? t.timestamp.slice(11, 19) : "";
      const tokens = t.tokens ? (t.tokens.total_tokens || "") : "";
      tr.innerHTML = '<td>' + ts + '</td><td>' + t.type + '</td><td>' + escapeHtml(t.name || "") + '</td><td>' + (t.duration_ms || 0) + 'ms</td><td>' + tokens + '</td>';
      traceBodyEl.appendChild(tr);
    });
  } catch (e) { console.error(e); }
}

newSession();
checkAuth();
</script>
</body>
</html>
